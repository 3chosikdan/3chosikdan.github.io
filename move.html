<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>머신 사용법 — 세팅·근육·실수 체크 | 3초식단</title>
<meta name="description" content="헬스장 머신 32가지 동작의 세팅 방법, 쓰이는 근육, 자주 하는 실수. 랫풀다운·하이로우·레그프레스 등 10종은 동작 애니메이션과 3D로 확인.">
<link rel="canonical" href="https://3cho.kr/move.html">
<meta property="og:title" content="머신 사용법 — 3초식단">
<meta property="og:description" content="세팅·근육·흔한 실수를 머신마다 한 장으로. 동작 애니메이션과 3D까지.">
<meta property="og:image" content="https://3cho.kr/og.png">
<link rel="icon" href="icon-192.png">
<script>
(function(){try{var t=(JSON.parse(localStorage.getItem('foodspot')||'{}').theme)||'light';if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; background:#fff; color:#111; max-width:560px; margin:0 auto; padding:20px 20px 64px; }
  a { color:#111; font-weight:700; text-decoration:none; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .wm { font-size:18px; font-weight:900; letter-spacing:-1px; }
  .wm span { color:#30d158; }
  .top a.sub { color:#8e8e93; font-size:12.5px; }
  h1 { font-size:24px; font-weight:900; letter-spacing:-0.8px; margin:20px 0 4px; }
  .lead { font-size:13.5px; color:#8e8e93; line-height:1.55; margin-bottom:14px; }
  h2 { font-size:13px; color:#8e8e93; margin:22px 0 8px; font-weight:800; }
  .search { width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid #e5e5ea; font-size:15px; font-family:inherit; background:#fff; color:#111; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile { display:block; padding:12px 12px; border-radius:12px; background:#f2f2f7; font-size:14px; line-height:1.35; }
  .tile small { display:block; color:#8e8e93; font-weight:600; font-size:11.5px; margin-top:2px; }
  .badge { display:inline-block; font-size:10.5px; font-weight:800; color:#0a8f3c; background:#eafaf0; border-radius:6px; padding:1px 5px; margin-left:4px; vertical-align:1px; }
  .stage { background:#f7f7f9; border-radius:16px; padding:10px; position:relative; }
  .stage .anim { height:260px; display:flex; align-items:center; justify-content:center; }
  .stage .anim svg { width:100%; height:100%; }
  .stage canvas { width:100% !important; height:auto !important; border-radius:12px; display:block; }
  .seg { display:flex; gap:6px; margin:10px 0 0; }
  .seg button { flex:1; padding:10px; border-radius:10px; border:none; background:#e5e5ea; color:#3a3a3c; font-weight:800; font-size:13.5px; font-family:inherit; cursor:pointer; }
  .seg button.on { background:#111; color:#fff; }
  .seg button.bad.on { background:#ff3b30; }
  .cap { font-size:13px; line-height:1.55; margin-top:8px; color:#3a3a3c; min-height:40px; }
  .cap b { color:#111; }
  .btn3d { display:block; width:100%; margin-top:8px; padding:12px; border-radius:12px; border:1.5px solid #e5e5ea; background:#fff; font-weight:800; font-size:14px; font-family:inherit; cursor:pointer; color:#111; }
  .hint { font-size:11.5px; color:#8e8e93; text-align:center; margin-top:6px; }
  .mm { display:flex; gap:10px; align-items:flex-start; }
  .mm svg { flex:1; max-width:50%; height:auto; }
  .legend { font-size:12.5px; line-height:1.7; margin-top:6px; color:#3a3a3c; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  ol.set { margin:0 0 0 20px; font-size:14px; line-height:1.65; }
  ol.set li { margin-bottom:6px; }
  .cue { background:#f2f2f7; border-radius:12px; padding:12px 14px; font-size:13.5px; line-height:1.6; }
  .ox { display:flex; flex-direction:column; gap:8px; }
  .ox div { border-radius:12px; padding:11px 14px; font-size:13.5px; line-height:1.55; }
  .ox .x { background:#fff1f0; } .ox .x b { color:#d70015; }
  .ox .o { background:#eafaf0; margin-top:-4px; } .ox .o b { color:#0a8f3c; }
  .alt { border-top:1px solid #f2f2f7; padding:10px 0; }
  .alt .bh { display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:14px; }
  .alt .ms { font-size:13px; color:#3a3a3c; line-height:1.7; margin-top:2px; }
  .alt.mine { background:#fffbea; border-radius:12px; padding:10px 12px; border:none; margin-bottom:6px; }
  .star { border:none; background:#f2f2f7; border-radius:100px; padding:5px 10px; font-size:12px; font-weight:800; color:#3a3a3c; cursor:pointer; font-family:inherit; }
  .star.on { background:#ffd60a; color:#111; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .cta { display:block; margin:24px 0 8px; padding:16px; border-radius:14px; background:#111; color:#fff; text-align:center; font-weight:800; }
  .foot { font-size:11px; color:#c7c7cc; margin-top:16px; line-height:1.6; }
  .note { font-size:12.5px; color:#8e8e93; margin:-2px 0 10px; }
  .hide { display:none; }
  html.dark { color-scheme:dark; }
  html.dark body { background:#000; color:#f2f2f7; }
  html.dark a, html.dark .cap b { color:#f2f2f7; }
  html.dark .tile, html.dark .cue, html.dark .star { background:#1c1c1e; color:#e5e5ea; }
  html.dark .stage { background:#111; }
  html.dark .seg button { background:#2c2c2e; color:#e5e5ea; }
  html.dark .seg button.on { background:#f2f2f7; color:#000; }
  html.dark .seg button.bad.on { background:#ff453a; color:#fff; }
  html.dark .search, html.dark .btn3d { background:#1c1c1e; border-color:#2c2c2e; color:#f2f2f7; }
  html.dark .cap, html.dark .legend, html.dark .alt .ms, html.dark ol.set { color:#d1d1d6; }
  html.dark .ox .x { background:#2a1514; } html.dark .ox .o { background:#122a1a; }
  html.dark .alt { border-color:#2c2c2e; } html.dark .alt.mine { background:#2a2614; }
  html.dark .cta { background:#f2f2f7; color:#000; }
</style>
</head>
<body>
<div class="top"><a class="wm" href="./">3초식단<span>.</span></a><span><a class="sub" href="move.html">사용법 전체</a> · <a class="sub" href="machines.html">머신 사전</a></span></div>
<main id="app"></main>
<p class="foot">일반적인 운동 정보이며 의학적 조언이 아닙니다. 통증이 있으면 멈추고 전문가와 상의하세요. 동작 그림은 특정 브랜드 제품이 아닌 같은 계열 머신의 공통 궤적입니다.</p>
<script src="moves.js?v=1"></script>
<script src="gymdb.js?v=3"></script>
<script src="rig.js?v=1"></script>
<script>
(function(){
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dark = document.documentElement.classList.contains('dark');
const MUS = { chest:'가슴', frontdelt:'전면 어깨', sidedelt:'측면 어깨', reardelt:'후면 어깨', lats:'광배근', uppertrap:'승모·능형근', erector:'척추기립근', biceps:'이두', triceps:'삼두', forearm:'전완', abs:'복직근', obliques:'복사근', quads:'대퇴사두', hams:'햄스트링', glutes:'대둔근', glutemed:'중둔근', adductors:'내전근', calves:'종아리' };
const GROUPS = ['가슴','등','어깨','이두','삼두','대퇴사두','햄스트링','둔근','내전','종아리','복부'];
/* ---------- 우리 헬스장 ---------- */
const MYKEY = '3cho:mygym';
function myGym(){ try{ const v = JSON.parse(localStorage.getItem(MYKEY)||'{}'); return Array.isArray(v.brands) ? v.brands : []; }catch(_){ return []; } }
function setMyGym(list){ try{ localStorage.setItem(MYKEY, JSON.stringify({ brands:list, at:Date.now() })); }catch(_){} }
window.toggleGym = function(b){ const L = myGym(); const i = L.indexOf(b); if(i>=0) L.splice(i,1); else L.push(b); setMyGym(L); render(); };
/* ---------- 근육 지도 ---------- */
function muscleSVG(side, p, s){
  const col = id=> p.indexOf(id)>=0 ? '#30d158' : s.indexOf(id)>=0 ? '#a8e6b8' : (dark?'#2c2c2e':'#e5e5ea');
  const base = dark ? '#3a3a3c' : '#d1d1d6';
  const E = (id,cx,cy,rx,ry,rot)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${col(id)}"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:''}/>`;
  const pair = (id,cx,cy,rx,ry,rot)=>E(id,cx,cy,rx,ry,rot?rot:0)+E(id,120-cx,cy,rx,ry,rot?-rot:0);
  let g = `<circle cx="60" cy="18" r="11" fill="${base}"/><rect x="54" y="27" width="12" height="9" rx="3" fill="${base}"/>
    <path d="M32 44 Q60 36 88 44 L92 70 Q86 104 80 116 L40 116 Q34 104 28 70 Z" fill="${base}"/>
    <path d="M40 114 L80 114 L82 128 L40 128 Z" fill="${base}"/>
    <rect x="20" y="46" width="13" height="56" rx="6" fill="${base}" transform="rotate(8 26 46)"/><rect x="87" y="46" width="13" height="56" rx="6" fill="${base}" transform="rotate(-8 94 46)"/>
    <rect x="15" y="98" width="11" height="40" rx="5" fill="${base}" transform="rotate(6 20 98)"/><rect x="94" y="98" width="11" height="40" rx="5" fill="${base}" transform="rotate(-6 100 98)"/>
    <rect x="40" y="124" width="18" height="64" rx="8" fill="${base}"/><rect x="62" y="124" width="18" height="64" rx="8" fill="${base}"/>
    <rect x="42" y="184" width="14" height="46" rx="6" fill="${base}"/><rect x="64" y="184" width="14" height="46" rx="6" fill="${base}"/>`;
  if(side==='front'){
    g += pair('frontdelt',37,52,7,8,20) + pair('sidedelt',29,57,4.5,8,10) + pair('chest',49,62,11,8.5) + pair('biceps',27,78,5,12,8) + pair('forearm',21,114,4.6,13,6)
      + `<rect x="53" y="74" width="14" height="38" rx="5" fill="${col('abs')}"/>` + pair('obliques',44,94,4.5,13) + pair('glutemed',41,121,4,6)
      + pair('quads',49,152,8.5,26) + pair('adductors',57,140,2.6,13) + pair('calves',49,206,5,14);
  } else {
    g += `<path d="M60 38 L76 50 L60 74 L44 50 Z" fill="${col('uppertrap')}"/>` + pair('reardelt',36,53,6.5,7,-20) + pair('sidedelt',29,57,4.5,8,10)
      + pair('lats',46,84,9,18,12) + pair('triceps',27,78,5,12,8) + pair('forearm',21,114,4.6,13,6)
      + `<rect x="54.5" y="76" width="4.5" height="38" rx="2" fill="${col('erector')}"/><rect x="61" y="76" width="4.5" height="38" rx="2" fill="${col('erector')}"/>`
      + pair('glutemed',41,117,4.5,6) + pair('glutes',50,126,9.5,9) + pair('hams',49,158,8,23) + pair('calves',49,203,6,15);
  }
  return `<svg viewBox="0 0 120 236" role="img" aria-label="${side==='front'?'앞':'뒤'} 근육 지도">${g}<text x="60" y="234" text-anchor="middle" font-size="9" fill="#8e8e93">${side==='front'?'앞':'뒤'}</text></svg>`;
}
/* ---------- 데이터 ---------- */
const DB = window.GYM_DB || []; const MV = window.MOVES || [];
const byId = id=>MV.find(m=>m.id===id);
function machinesOf(id){ const out = []; DB.forEach(b=>b.machines.forEach(m=>{ if(m[4]===id) out.push({ brand:b.ko, name:m[0] }); })); return out; }
const params = new URLSearchParams(location.search);
let anim = null, mode = 'ok', view3d = false;
function stopAnim(){ if(anim && anim.stop) anim.stop(); anim = null; }
function startAnim(mv){
  const el = $('#anim'); if(!el || !window.RIG || !RIG.has(mv.id)) return;
  stopAnim();
  if(view3d && window.THREE){ anim = RIG.rig3D(el, mv.id, { move:mv, bad:mode==='bad', dark }); }
  else anim = RIG.rig2D(el, mv.id, { move:mv, bad:mode==='bad', dark });
  const cap = $('#cap'); if(cap) cap.innerHTML = mode==='bad'
    ? `<b>✗ ${esc(mv.x[0][0])}</b><br>→ ${esc(mv.x[0][1])}` : `<b>✓ ${esc(mv.cue[0])}</b>`;
}
window.setMode = function(m){ mode = m; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); startAnim(window._mv); };
window.go3d = function(){
  const btn = $('#btn3d');
  if(view3d){ view3d = false; btn.textContent = '3D로 돌려보기'; $('#hint3d').classList.add('hide'); startAnim(window._mv); return; }
  const done = ()=>{ view3d = true; btn.textContent = '2D로 보기'; $('#hint3d').classList.remove('hide'); startAnim(window._mv); };
  if(window.THREE) return done();
  btn.textContent = '3D 불러오는 중…';
  const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  sc.onload = done; sc.onerror = ()=>{ btn.textContent = '3D를 불러오지 못했어요'; };
  document.head.appendChild(sc);
};
/* ---------- 화면 ---------- */
function hub(){
  document.title = '머신 사용법 — 세팅·근육·실수 체크 | 3초식단';
  const mine = myGym();
  let h = `<h1>머신 사용법</h1><p class="lead">머신 이름을 치면 세팅 방법, 쓰이는 근육, 자주 하는 실수를 보여줍니다. <span class="badge">동작</span> 표시가 있는 10가지는 애니메이션과 3D도 있어요.</p>
  <input class="search" id="q" type="search" placeholder="머신 이름 (예: 파나타 슈퍼 하이로우, 펙덱)" aria-label="머신 이름" autocomplete="off">
  <div id="qr" class="note" style="margin-top:8px;"></div>`;
  GROUPS.forEach(g=>{ const L = MV.filter(m=>m.grp===g); if(!L.length) return;
    h += `<h2>${g}</h2><div class="grid">` + L.map(m=>`<a class="tile" href="move.html?t=${m.id}">${esc(m.name)}${m.rig?'<span class="badge">동작</span>':''}<small>머신 ${machinesOf(m.id).length}종</small></a>`).join('') + `</div>`; });
  h += `<h2 id="mygym">우리 헬스장 브랜드</h2><p class="note">다니는 헬스장에 있는 브랜드를 고르면 대체 머신 목록과 운동 탭 종목 추가에서 먼저 보여요. 로그인하면 다른 기기에도 따라옵니다.</p>
  <div class="chips">` + DB.map(b=>`<button type="button" class="star${mine.indexOf(b.ko)>=0?' on':''}" onclick="toggleGym('${esc(b.ko)}')">${mine.indexOf(b.ko)>=0?'★ ':'☆ '}${esc(b.ko)}</button>`).join('') + `</div>
  <a class="cta" href="./">운동 탭에서 바로 기록하기</a>`;
  $('#app').innerHTML = h;
  const q = $('#q'); q.addEventListener('input', ()=>{
    const v = q.value.trim(); const r = $('#qr');
    if(!v){ r.innerHTML=''; return; }
    const m = window.moveOf(v);
    r.innerHTML = m ? `→ <a href="move.html?t=${m.id}&n=${encodeURIComponent(v)}">${esc(m.name)} 사용법 보기</a>` : '아직 분류하지 못한 이름이에요. 아래 목록에서 골라주세요.';
  });
  q.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const m = window.moveOf(q.value); if(m) location.href = `move.html?t=${m.id}&n=${encodeURIComponent(q.value.trim())}`; } });
}
function detail(mv, asked){
  window._mv = mv;
  document.title = `${mv.name} 사용법 — 세팅·근육·흔한 실수 | 3초식단`;
  const mine = myGym();
  let h = `<h1>${esc(mv.name)}</h1>`;
  if(asked) h += `<p class="note">'${esc(asked)}'은(는) <b>${esc(mv.name)}</b> 계열이에요. 브랜드가 달라도 세팅과 궤적 원리는 같아요.</p>`;
  h += `<p class="lead">주로 <b>${mv.p.map(x=>MUS[x]).join(' · ')}</b>${mv.s.length?`, 보조로 ${mv.s.map(x=>MUS[x]).join(' · ')}`:''}을(를) 씁니다.</p>`;
  if(mv.rig && window.RIG && RIG.has(mv.id)){
    h += `<div class="stage"><div class="anim" id="anim"></div>
      <div class="seg"><button type="button" data-m="ok" class="on" onclick="setMode('ok')">✓ 바른 동작</button><button type="button" data-m="bad" class="bad" onclick="setMode('bad')">✗ 흔한 실수</button></div>
      <div class="cap" id="cap"></div>
      <button type="button" class="btn3d" id="btn3d" onclick="go3d()">3D로 돌려보기</button>
      <p class="hint hide" id="hint3d">손가락으로 끌어서 돌려보세요 · 초록 = 주로 쓰는 근육</p></div>`;
  }
  h += `<h2>쓰이는 근육</h2><div class="mm">${muscleSVG('front', mv.p, mv.s)}${muscleSVG('back', mv.p, mv.s)}</div>
    <div class="legend"><span class="dot" style="background:#30d158"></span>주동근 ${mv.p.map(x=>MUS[x]).join(', ')}${mv.s.length?` &nbsp; <span class="dot" style="background:#a8e6b8"></span>보조 ${mv.s.map(x=>MUS[x]).join(', ')}`:''}</div>`;
  h += `<h2>세팅 체크</h2><ol class="set">${mv.set.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  h += `<h2>이렇게 움직여요</h2><div class="cue">${mv.cue.map(x=>'· '+esc(x)).join('<br>')}</div>`;
  h += `<h2>자주 하는 실수</h2><div class="ox">${mv.x.map(x=>`<div class="x"><b>✗</b> ${esc(x[0])}</div><div class="o"><b>✓</b> ${esc(x[1])}</div>`).join('')}</div>`;
  // 대체 머신
  const alts = machinesOf(mv.id); const by = {};
  alts.forEach(a=>{ (by[a.brand] = by[a.brand]||[]).push(a.name); });
  const brands = Object.keys(by).sort((a,b)=>(mine.indexOf(b)>=0)-(mine.indexOf(a)>=0));
  h += `<h2>같은 계열 머신 · ${alts.length}종</h2><p class="note">원하는 머신이 없으면 같은 계열로 바꿔도 됩니다. ☆를 누르면 '우리 헬스장'으로 표시돼 위로 올라와요.</p>`;
  h += brands.map(b=>`<div class="alt${mine.indexOf(b)>=0?' mine':''}"><div class="bh"><span>${esc(b)}${mine.indexOf(b)>=0?' <span class="badge">우리 헬스장</span>':''}</span><button type="button" class="star${mine.indexOf(b)>=0?' on':''}" onclick="toggleGym('${esc(b)}')">${mine.indexOf(b)>=0?'★':'☆'}</button></div><div class="ms">${by[b].map(esc).join(' · ')}</div></div>`).join('');
  // 같은 부위 다른 동작
  const sib = MV.filter(m=>m.grp===mv.grp && m.id!==mv.id);
  if(sib.length) h += `<h2>${mv.grp} 다른 동작</h2><div class="grid">${sib.map(m=>`<a class="tile" href="move.html?t=${m.id}">${esc(m.name)}${m.rig?'<span class="badge">동작</span>':''}</a>`).join('')}</div>`;
  h += `<a class="cta" href="./">이 동작 기록하러 가기 → 운동 탭</a>`;
  $('#app').innerHTML = h;
  startAnim(mv);
}
function render(){
  stopAnim();
  const t = params.get('t'), n = params.get('n');
  let mv = t ? byId(t) : null;
  if(!mv && n) mv = window.moveOf(n);
  if(mv) detail(mv, n); else hub();
}
render();
})();
</script>
</body>
</html>
